<?xml version="1.0" encoding="UTF-8"?>
<!--
  Homepage 概念图 v1（Dark 基线 + 卡片为主）
  - 目的：在实施首页呈现前，共识布局、信息层级与交互重点
  - 视觉基线：沿用 tokens.css 深色基调；不体现真实文案与品牌，仅做结构概念
  - 关键点：
    * 顶部导航（产品名/Logo 预留位）
    * 问题输入区 + 主操作按钮（开始抽牌）
    * 卡片网格（3x4），真实尺寸比例接近 2:3，圆角 10
    * 状态层：加载 Skeleton、错误条（内联 + 重试）
    * 无障碍提示位（仅示意）
-->
<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Tarot App - 首页概念图 v1</title>
  <desc id="desc">包含顶部导航、问题输入与主按钮、3x4 卡片网格、错误条与加载 Skeleton 的结构概念图。</desc>

  <!-- 背景 -->
  <rect width="1200" height="800" fill="#0b0c10"/>

  <!-- 顶部导航条 -->
  <rect x="0" y="0" width="1200" height="64" fill="#111216"/>
  <!-- Logo / 标题占位 -->
  <rect x="40" y="20" width="120" height="24" rx="6" fill="#1f2937"/>
  <!-- 次要操作占位 -->
  <rect x="1040" y="18" width="120" height="28" rx="10" fill="#1f2937"/>

  <!-- 页面标题与引导文案 -->
  <rect x="80" y="88" width="360" height="24" rx="6" fill="#e5e7eb" opacity="0.9"/>
  <rect x="80" y="120" width="520" height="14" rx="6" fill="#e5e7eb" opacity="0.4"/>

  <!-- 问题输入与主按钮区 -->
  <rect x="80" y="156" width="680" height="48" rx="10" fill="#111216"/>
  <rect x="780" y="156" width="140" height="48" rx="10" fill="#8ab4f8" opacity="0.7"/>
  <text x="818" y="186" fill="#0b0c10" font-family="system-ui, -apple-system, Segoe UI, Roboto" font-size="14" font-weight="600">开始抽牌</text>

  <!-- 内联错误条（示意，默认隐藏；此处展示） -->
  <g>
    <rect x="80" y="216" width="840" height="40" rx="8" fill="#2b2a30" stroke="#8a3d3d" stroke-width="1"/>
    <text x="96" y="242" fill="#e5e7eb" font-family="system-ui, -apple-system, Segoe UI, Roboto" font-size="13">网络异常，已切换本地牌组。您可以</text>
    <rect x="360" y="224" width="72" height="24" rx="8" fill="#8ab4f8"/>
    <text x="378" y="242" fill="#0b0c10" font-family="system-ui, -apple-system, Segoe UI, Roboto" font-size="12" font-weight="600">重试</text>
  </g>

  <!-- 网格分隔线 -->
  <rect x="80" y="270" width="1040" height="2" fill="#1f2937"/>

  <!-- 卡片网格（3 行 x 4 列），单卡 200x300，间距 24 -->
  <!-- 行 1 -->
  <g>
    <rect x="80" y="300" width="200" height="300" rx="10" fill="#111216"/>
    <rect x="304" y="300" width="200" height="300" rx="10" fill="#111216"/>
    <rect x="528" y="300" width="200" height="300" rx="10" fill="#111216"/>
    <rect x="752" y="300" width="200" height="300" rx="10" fill="#111216"/>
  </g>
  <!-- 行 2 -->
  <g>
    <rect x="80" y="624" width="200" height="300" rx="10" fill="#111216"/>
    <rect x="304" y="624" width="200" height="300" rx="10" fill="#111216"/>
    <rect x="528" y="624" width="200" height="300" rx="10" fill="#111216"/>
    <rect x="752" y="624" width="200" height="300" rx="10" fill="#111216"/>
  </g>

  <!-- 加载 Skeleton（覆盖示意） -->
  <defs>
    <linearGradient id="shimmer3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111216" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8ab4f8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#111216" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip-cards">
      <rect x="80" y="300" width="200" height="300" rx="10"/>
      <rect x="304" y="300" width="200" height="300" rx="10"/>
      <rect x="528" y="300" width="200" height="300" rx="10"/>
      <rect x="752" y="300" width="200" height="300" rx="10"/>
      <rect x="80" y="624" width="200" height="300" rx="10"/>
      <rect x="304" y="624" width="200" height="300" rx="10"/>
      <rect x="528" y="624" width="200" height="300" rx="10"/>
      <rect x="752" y="624" width="200" height="300" rx="10"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip-cards)">
    <rect x="-400" y="300" width="400" height="624" fill="url(#shimmer3)">
      <animateTransform attributeName="transform" type="translate" from="-400 0" to="1200 0" dur="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 注释标签 -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto" font-size="12" fill="#e5e7eb" opacity="0.8">
    <text x="80" y="84">页面标题与引导</text>
    <text x="80" y="152">输入问题</text>
    <text x="780" y="152">主操作按钮</text>
    <text x="80" y="292">卡片网格（3x4）</text>
    <text x="80" y="268">状态分隔线</text>
    <text x="80" y="260">错误条（Inline）+ 重试</text>
  </g>

</svg>