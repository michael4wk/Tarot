<?xml version="1.0" encoding="UTF-8"?>
<!-- Skeleton 方案 A：卡片轮廓骨架（已移除包含双连字符的注释，确保 XML 合法） -->
<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Skeleton A - 卡片轮廓骨架</title>
  <desc id="desc">深色背景上，标题与输入区的占位条，以及 3x4 的卡片矩形轮廓骨架，带浅色高光扫过动画。</desc>

  <!-- 背景 -->
  <rect width="1200" height="800" fill="#0b0c10"/>

  <!-- 页面主标题占位 -->
  <rect x="80" y="60" width="320" height="20" rx="6" fill="#111216"/>
  <rect x="80" y="90" width="220" height="16" rx="6" fill="#111216" opacity="0.8"/>

  <!-- 输入框与主按钮占位区 -->
  <rect x="80" y="140" width="620" height="44" rx="10" fill="#111216"/>
  <rect x="720" y="140" width="120" height="44" rx="10" fill="#111216"/>

  <!-- 网格区域分割线（顶部） -->
  <rect x="80" y="210" width="1040" height="2" fill="#1f2937"/>

  <!-- 卡片网格（3 行 x 4 列）每张卡片 200x300，间距 24px -->
  <!-- 行 1 -->
  <g>
    <rect x="80" y="240" width="200" height="300" rx="10" fill="#111216"/>
    <rect x="304" y="240" width="200" height="300" rx="10" fill="#111216"/>
    <rect x="528" y="240" width="200" height="300" rx="10" fill="#111216"/>
    <rect x="752" y="240" width="200" height="300" rx="10" fill="#111216"/>
  </g>
  <!-- 行 2 -->
  <g>
    <rect x="80" y="564" width="200" height="300" rx="10" fill="#111216"/>
    <rect x="304" y="564" width="200" height="300" rx="10" fill="#111216"/>
    <rect x="528" y="564" width="200" height="300" rx="10" fill="#111216"/>
    <rect x="752" y="564" width="200" height="300" rx="10" fill="#111216"/>
  </g>

  <!-- 高光渐变定义（Shimmer） -->
  <defs>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111216" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8ab4f8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#111216" stop-opacity="0"/>
    </linearGradient>
    <!-- 用于裁剪：仅在骨架块区域显示高光 -->
    <clipPath id="clip-all">
      <rect x="80" y="60" width="320" height="20" rx="6"/>
      <rect x="80" y="90" width="220" height="16" rx="6"/>
      <rect x="80" y="140" width="620" height="44" rx="10"/>
      <rect x="720" y="140" width="120" height="44" rx="10"/>
      <rect x="80" y="240" width="200" height="300" rx="10"/>
      <rect x="304" y="240" width="200" height="300" rx="10"/>
      <rect x="528" y="240" width="200" height="300" rx="10"/>
      <rect x="752" y="240" width="200" height="300" rx="10"/>
      <rect x="80" y="564" width="200" height="300" rx="10"/>
      <rect x="304" y="564" width="200" height="300" rx="10"/>
      <rect x="528" y="564" width="200" height="300" rx="10"/>
      <rect x="752" y="564" width="200" height="300" rx="10"/>
    </clipPath>
  </defs>

  <!-- 高光移动条 -->
  <g clip-path="url(#clip-all)">
    <rect id="shine" x="-400" y="0" width="400" height="800" fill="url(#shimmer)">
      <animateTransform attributeName="transform" type="translate" from="-400 0" to="1200 0" dur="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 说明标签 -->
  <text x="80" y="204" fill="#e5e7eb" font-family="system-ui, -apple-system, Segoe UI, Roboto" font-size="12" opacity="0.7">Skeleton A：卡片轮廓骨架（3x4 布局，适配最终卡片尺寸与圆角）</text>
</svg>