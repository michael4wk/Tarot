<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512" width="320" height="512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="p" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="url(#g)"/>
      <circle cx="10" cy="10" r="2" fill="rgba(255,255,255,0.35)"/>
    </pattern>
    <filter id="noise" x="0" y="0">
      <feTurbulence baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" type="fractalNoise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.05"/>
      </feComponentTransfer>
      <feBlend mode="overlay" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="320" height="512" fill="url(#p)"/>
  <rect x="12" y="12" width="296" height="488" rx="16" ry="16" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
  <g filter="url(#noise)">
    <rect x="0" y="0" width="320" height="512" fill="transparent"/>
  </g>
</svg>